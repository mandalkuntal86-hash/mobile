<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop Ledger — Mobile Shop Billing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EAF1FB;
    --surface:#FFFFFF;
    --ink:#152238;
    --ink-soft:#5C7089;
    --line:#DCE6F5;
    --accent:#2563EB;
    --accent-2:#0891B2;
    --accent-ink:#FFFFFF;
    --accent-soft:#DCEAFE;
    --info:#0E7490;
    --info-bg:#E1F3F8;
    --good:#15803D;
    --good-bg:#E1F4E7;
    --bad:#C0334A;
    --bad-bg:#FBE4E9;
    --side-bg:#0A1E42;
    --side-bg-2:#122c5c;
    --side-ink:#E7EEFC;
    --side-ink-dim:#8CA3C9;
    --side-active:#1D3E78;
    --radius:10px;
    --radius-sm:6px;
    --shadow:0 1px 2px rgba(21,34,56,.06), 0 6px 18px rgba(21,34,56,.06);
    --shadow-lift:0 10px 28px rgba(21,34,56,.14), 0 2px 6px rgba(21,34,56,.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0; overflow-x:hidden;}
  body{
    font-family:'Inter',system-ui,sans-serif;
    background:
      radial-gradient(1100px 480px at 100% -8%, #dceafe 0%, transparent 55%),
      var(--bg);
    color:var(--ink);
    font-size:14px;
    line-height:1.5;
  }
  h1,h2,h3{
    font-family:'Zilla Slab',Georgia,serif;
    font-weight:600;
    margin:0 0 4px 0;
    letter-spacing:.01em;
  }
  .num{ font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums; }
  #app{ display:flex; min-height:100vh; }

  /* ---- Sidebar ---- */
  #sidebar{
    width:222px; flex-shrink:0; color:var(--side-ink);
    background:linear-gradient(180deg, var(--side-bg-2) 0%, var(--side-bg) 100%);
    display:flex; flex-direction:column; padding:20px 0;
    box-shadow:2px 0 18px rgba(0,0,0,.18);
  }
  #sidebar .brand{ padding:0 20px 18px 20px; border-bottom:1px solid #1c3c6e; margin-bottom:10px; display:flex; align-items:center; gap:10px;}
  #sidebar .brand .mark{ width:32px; height:32px; border-radius:8px; background:linear-gradient(135deg, var(--accent), var(--accent-2)); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:700; color:#fff; box-shadow:0 3px 10px rgba(37,99,235,.4);}
  #sidebar .brand .name{ font-family:'Zilla Slab',serif; font-size:18px; font-weight:700; color:#fff; line-height:1.15; }
  #sidebar .brand .sub{ font-size:10.5px; color:var(--side-ink-dim); margin-top:2px; letter-spacing:.03em; text-transform:uppercase;}
  .navlist{ list-style:none; margin:0; padding:0 8px; flex:1; }
  .navlist li{ margin:2px 0; }
  .navbtn{
    display:flex; align-items:center; gap:10px; width:100%; text-align:left;
    background:none; border:none; color:var(--side-ink-dim); font:inherit; font-size:13.5px;
    padding:9px 12px; cursor:pointer; border-radius:7px; border-left:3px solid transparent;
    transition:background .15s ease, color .15s ease;
  }
  .navbtn .ic{ width:16px; text-align:center; font-size:14px; }
  .navbtn:hover{ background:#152f5c; color:var(--side-ink); }
  .navbtn.active{ background:var(--side-active); color:#fff; border-left-color:#5CA8FF; font-weight:600; box-shadow:inset 0 0 0 1px rgba(255,255,255,.04);}
  #sidebar .footer{ padding:14px 20px 0 20px; font-size:11px; color:var(--side-ink-dim); border-top:1px solid #1c3c6e; margin-top:10px;}

  /* ---- Main ---- */
  #main{ flex:1; padding:26px 34px 60px 34px; max-width:1220px; }
  .pagehead{ display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:20px; flex-wrap:wrap; gap:10px;}
  .pagehead h1{ font-size:24px; }
  .pagehead .desc{ color:var(--ink-soft); font-size:13px; margin-top:2px;}

  .card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:20px; margin-bottom:18px; transition:box-shadow .15s ease; }
  .card h2{ font-size:16px; margin-bottom:14px; }
  .card h3{ font-size:14px; margin-bottom:10px;}

  .grid{ display:grid; gap:14px; }
  .grid.cols-2{ grid-template-columns:1fr 1fr; }
  .grid.cols-3{ grid-template-columns:1fr 1fr 1fr; }
  .grid.cols-4{ grid-template-columns:repeat(4,1fr); }
  @media (max-width:900px){ .grid.cols-2,.grid.cols-3,.grid.cols-4{ grid-template-columns:1fr 1fr; } }

  label{ display:block; font-size:12px; font-weight:600; color:var(--ink-soft); margin-bottom:5px; }
  input[type=text],input[type=number],input[type=tel],input[type=date],input[type=email],select,textarea{
    width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:4px; background:#FAFCFF;
    font:inherit; font-size:13.5px; color:var(--ink);
  }
  input:focus,select:focus,textarea:focus{ outline:2px solid #2563EB40; border-color:var(--accent); }
  .field{ margin-bottom:12px; }

  button{ font:inherit; cursor:pointer; }
  .btn{
    display:inline-flex; align-items:center; gap:6px; padding:8px 16px; border-radius:var(--radius-sm); border:1px solid var(--line);
    background:#fff; color:var(--ink); font-weight:600; font-size:13px; transition:background .12s ease, transform .12s ease, box-shadow .12s ease;
  }
  .btn:hover{ background:#EEF4FE; }
  .btn:active{ transform:translateY(1px); }
  .btn.primary{ background:linear-gradient(180deg, var(--accent), #1E45B8); border-color:#1E45B8; color:var(--accent-ink); box-shadow:0 2px 8px rgba(37,99,235,.32); }
  .btn.primary:hover{ background:linear-gradient(180deg, #4079F0, #1B3E9F); }
  .btn.ghost{ border-color:transparent; background:transparent; }
  .btn.danger{ color:var(--bad); border-color:var(--bad-bg); }
  .btn.danger:hover{ background:var(--bad-bg); }
  .btn.sm{ padding:5px 10px; font-size:12px; }

  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th{ text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); padding:8px 10px; border-bottom:1px solid var(--line); }
  td{ padding:9px 10px; border-bottom:1px solid #E8EFFA; vertical-align:middle; }
  tr:last-child td{ border-bottom:none; }
  tr:hover td{ background:#F5F9FE; }
  td.num,th.num{ text-align:right; }

  .pill{ display:inline-block; padding:2px 9px; border-radius:20px; font-size:11px; font-weight:700; }
  .pill.good{ background:var(--good-bg); color:var(--good); }
  .pill.bad{ background:var(--bad-bg); color:var(--bad); }
  .pill.neutral{ background:#E6EDF9; color:var(--ink-soft); }
  .pill.info{ background:var(--info-bg); color:var(--info); }

  .avatar{ display:inline-flex; align-items:center; justify-content:center; width:28px; height:28px; border-radius:50%; background:var(--accent-soft); color:var(--accent); font-weight:700; font-size:12px; flex-shrink:0; }

  .kpis{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:18px; }
  @media (max-width:900px){ .kpis{ grid-template-columns:1fr 1fr; } }
  .kpi{ background:var(--surface); border:1px solid var(--line); border-left:3px solid var(--accent); border-radius:var(--radius); padding:16px 18px; box-shadow:var(--shadow); transition:box-shadow .15s ease, transform .15s ease; }
  .kpi:hover{ box-shadow:var(--shadow-lift); transform:translateY(-1px); }
  .kpi.good{ border-left-color:var(--good); }
  .kpi.bad{ border-left-color:var(--bad); }
  .kpi.info{ border-left-color:var(--info); }
  .kpi .label{ font-size:11.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; margin-bottom:6px;}
  .kpi .value{ font-family:'IBM Plex Mono',monospace; font-size:22px; font-weight:600; }
  .kpi .sub{ font-size:11.5px; color:var(--ink-soft); margin-top:4px;}

  .itemrow{ display:grid; grid-template-columns:2.4fr .8fr .9fr .9fr 30px; gap:8px; align-items:end; margin-bottom:8px; }
  .itemrow .rm{ color:var(--bad); background:none; border:none; font-size:18px; line-height:1; padding:6px; }
  .itemhead{ display:grid; grid-template-columns:2.4fr .8fr .9fr .9fr 30px; gap:8px; font-size:11px; color:var(--ink-soft); margin-bottom:4px; text-transform:uppercase; letter-spacing:.03em;}

  .empty{ text-align:center; padding:36px 10px; color:var(--ink-soft); }
  .empty .big{ font-size:28px; margin-bottom:8px; }

  .tabs2{ display:flex; gap:4px; margin-bottom:16px; border-bottom:1px solid var(--line); }
  .tab2{ padding:8px 16px; border:none; background:none; font:inherit; font-weight:600; font-size:13px; color:var(--ink-soft); border-bottom:2px solid transparent; cursor:pointer;}
  .tab2.active{ color:var(--accent); border-bottom-color:var(--accent); }

  .modal-bg{ position:fixed; inset:0; background:rgba(10,24,48,.55); display:flex; align-items:flex-start; justify-content:center; padding:40px 16px; overflow:auto; z-index:50;}
  .modal{ background:#fff; border-radius:8px; width:100%; max-width:560px; padding:24px; box-shadow:0 12px 40px rgba(0,0,0,.25);}
  .modal.wide{ max-width:760px; }
  .modal-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;}
  .modal-close{ background:none;border:none;font-size:20px;color:var(--ink-soft);cursor:pointer; line-height:1;}

  .searchbar{ margin-bottom:14px; max-width:320px;}
  .row-between{ display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;}

  .imei-toggle{ background:none; border:none; color:var(--info); font-size:12px; font-weight:600; cursor:pointer; padding:4px 0; margin-bottom:8px; }
  .imei-toggle:hover{ text-decoration:underline; }
  .imei-box{ background:var(--info-bg); border:1px dashed #b7cdd8; border-radius:var(--radius-sm); padding:10px 12px; margin:-2px 0 12px 0; }
  .imei-box label{ color:var(--info); }
  .imei-box textarea{ background:#fff; }
  .imei-hint{ font-size:11px; color:var(--ink-soft); margin-top:4px; }
  select.sa-imei{ margin-top:6px; border-color:#b7cdd8; }

  .pill.instock{ background:var(--info-bg); color:var(--info); }
  .pill.sold{ background:var(--good-bg); color:var(--good); }

  .filter-tabs{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px; }
  .filter-tabs button{ padding:6px 13px; border-radius:20px; border:1px solid var(--line); background:#fff; font-size:12.5px; font-weight:600; color:var(--ink-soft); }
  .filter-tabs button.active{ background:var(--ink); color:#fff; border-color:var(--ink); }

  .mono-chip{ font-family:'IBM Plex Mono',monospace; font-size:12px; background:#EEF3FC; border:1px solid var(--line); border-radius:4px; padding:2px 7px; }

  .statement-row{ display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #E8EFFA; font-size:13px;}
  .statement-row:last-child{ border-bottom:none; }

  /* ---- Invoice / Print (plain bill) ---- */
  #invoice-paper{ background:#fff; padding:34px; width:100%; max-width:520px; margin:0 auto; font-family:'Inter',sans-serif; color:#1C2620; border:1px solid var(--line);}
  #invoice-paper .inv-head{ display:flex; justify-content:space-between; align-items:flex-start; border-bottom:2px solid #1C2620; padding-bottom:14px; margin-bottom:14px;}
  #invoice-paper .shopname{ font-family:'Zilla Slab',serif; font-size:20px; font-weight:700;}
  #invoice-paper .shopmeta{ font-size:11.5px; color:#5B6660; margin-top:3px; line-height:1.5;}
  #invoice-paper .inv-tag{ text-align:right; font-size:12px; }
  #invoice-paper .inv-tag .no{ font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:14px;}
  #invoice-paper table{ font-size:12.5px; }
  #invoice-paper th{ border-bottom:1px solid #1C2620; padding:5px 4px; }
  #invoice-paper td{ padding:6px 4px; border-bottom:1px dashed #DBD6C6; }
  #invoice-paper .totals{ margin-top:10px; margin-left:auto; width:220px; }
  #invoice-paper .totals .r{ display:flex; justify-content:space-between; padding:3px 0; font-size:12.5px;}
  #invoice-paper .totals .r.grand{ font-weight:700; font-size:15px; border-top:1px solid #1C2620; margin-top:4px; padding-top:6px;}
  #invoice-paper .footnote{ margin-top:20px; text-align:center; font-size:11px; color:#8a8f7f; border-top:1px dashed var(--line); padding-top:10px;}

  /* ---- GST Tax Invoice (formal boxed layout) ---- */
  #gst-invoice{ background:#fff; width:100%; max-width:760px; margin:0 auto; font-family:'Inter',Arial,sans-serif; color:#111; font-size:11.5px; border:1px solid #000; }
  #gst-invoice .gi-title{ text-align:center; font-weight:700; font-size:13px; padding:6px 0; border-bottom:1px solid #000; letter-spacing:.03em; }
  #gst-invoice table.gi-tbl{ width:100%; border-collapse:collapse; font-size:11.5px; }
  #gst-invoice table.gi-tbl td, #gst-invoice table.gi-tbl th{ border:1px solid #000; padding:5px 7px; vertical-align:top; }
  #gst-invoice .gi-shopname{ font-family:'Zilla Slab',serif; font-weight:700; font-size:16px; }
  #gst-invoice .gi-shopmeta{ font-size:11px; line-height:1.5; margin-top:2px; }
  #gst-invoice .gi-label{ color:#444; }
  #gst-invoice .gi-strong{ font-weight:700; }
  #gst-invoice .num{ text-align:right; }
  #gst-invoice .center{ text-align:center; }
  #gst-invoice .items-tbl th{ font-weight:700; font-size:10.5px; text-transform:none; background:#F4F2EA; }
  #gst-invoice .items-tbl td{ font-size:11px; }
  #gst-invoice .desc-code{ font-family:'IBM Plex Mono',monospace; font-size:9.5px; color:#444; font-style:italic; display:block; margin-top:2px;}
  #gst-invoice .gi-words{ padding:8px; border:1px solid #000; border-top:none; font-size:11.5px; }
  #gst-invoice .gi-words .lbl{ font-size:10px; color:#444; }
  #gst-invoice .gi-bottom{ display:flex; border:1px solid #000; border-top:none; }
  #gst-invoice .gi-bottom .qr-col{ width:34%; padding:10px; border-right:1px solid #000; font-size:10.5px; }
  #gst-invoke .qr-box{ width:80px; height:80px; }
  #gst-invoice .gi-bottom .bank-col{ flex:1; padding:10px; display:flex; flex-direction:column; justify-content:space-between; }
  #gst-invoice .gi-bottom .bank-details{ font-size:11px; line-height:1.7; }
  #gst-invoice .gi-sign{ text-align:right; font-size:11px; margin-top:24px; }
  #gst-invoice .gi-declaration{ font-size:10px; color:#444; margin-top:8px; line-height:1.4; }
  #gst-invoice .gi-footer{ text-align:center; font-size:10px; padding:5px 0; border-top:1px solid #000; }
  #gst-invoice .gi-footer2{ text-align:center; font-size:9.5px; color:#666; padding:3px 0; }

  @media print{
    body *{ visibility:hidden; }
    #invoice-paper, #invoice-paper *, #gst-invoice, #gst-invoice *{ visibility:visible; }
    #app{ display:none !important; }
    .modal-bg{ position:static !important; inset:auto !important; display:block !important; background:none !important; padding:0 !important; margin:0 !important; overflow:visible !important; height:auto !important; min-height:0 !important; }
    .modal{ position:static !important; box-shadow:none !important; border-radius:0 !important; padding:0 !important; margin:0 !important; max-width:100% !important; width:100% !important; }
    #invoice-paper{ position:static !important; top:auto; left:auto; border:none; box-shadow:none; max-width:100%; margin:0 auto; }
    #gst-invoice{ position:static !important; top:auto; left:auto; border:none; box-shadow:none; max-width:100%; margin:0 auto; }
    .no-print{ display:none !important; }
    @page{ margin:10mm; size:A4; }
  }

  ::-webkit-scrollbar{ width:10px; height:10px;}
  ::-webkit-scrollbar-thumb{ background:#b6c9e6; border-radius:6px;}

  /* ---- Login screen ---- */
  #login-screen{ min-height:100vh; display:flex; align-items:center; justify-content:center; background:radial-gradient(900px 500px at 15% 0%, #163a72 0%, transparent 55%), linear-gradient(160deg, var(--side-bg-2) 0%, var(--side-bg) 100%); padding:20px; }
  .login-card{ background:#fff; border-radius:10px; width:100%; max-width:360px; padding:30px 28px; box-shadow:0 20px 50px rgba(6,18,40,.45); }
  .login-card h1{ font-size:20px; margin-bottom:4px; }
  .login-card .sub{ font-size:12.5px; color:var(--ink-soft); margin-bottom:20px; }
  .login-card .field{ margin-bottom:14px; }
  .login-error{ background:var(--bad-bg); color:var(--bad); font-size:12.5px; padding:8px 10px; border-radius:4px; margin-bottom:14px; display:none; }
  .login-card button{ width:100%; padding:10px; }

  /* ---- Mobile topbar / off-canvas sidebar (phones & narrow tablets) ---- */
  .mobile-topbar{
    display:none; align-items:center; gap:12px; position:fixed; top:0; left:0; right:0; height:54px;
    background:linear-gradient(180deg, var(--side-bg-2) 0%, var(--side-bg) 100%); color:#fff; z-index:60;
    padding:0 14px; box-shadow:0 2px 12px rgba(6,14,30,.25);
  }
  .mobile-topbar .mt-title{ font-family:'Zilla Slab',serif; font-weight:700; font-size:16px; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .hamburger{ width:34px; height:34px; flex-shrink:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; background:none; border:none; cursor:pointer; padding:0; -webkit-tap-highlight-color:transparent; }
  .hamburger span{ display:block; width:20px; height:2px; background:#fff; border-radius:2px; }
  .sidebar-overlay{ display:none; position:fixed; inset:0; background:rgba(6,14,30,.55); z-index:55; }
  .sidebar-overlay.show{ display:block; }
  body.no-scroll{ overflow:hidden; }

  /* ---- Comfortable touch targets everywhere (phones/tablets) ---- */
  @media (max-width:880px){
    .mobile-topbar{ display:flex; }
    #sidebar{
      position:fixed; top:0; left:0; height:100vh; width:250px; max-width:82vw; z-index:65;
      transform:translateX(-100%); transition:transform .22s ease; box-shadow:2px 0 28px rgba(0,0,0,.35);
    }
    #sidebar.open{ transform:translateX(0); }
    #main{ padding:66px 16px 40px 16px; max-width:100%; }
    .kpis{ grid-template-columns:1fr 1fr; }
  }
  @media (max-width:640px){
    .grid.cols-2,.grid.cols-3,.grid.cols-4{ grid-template-columns:1fr; }
    .kpis{ grid-template-columns:1fr 1fr; gap:10px; }
    .pagehead{ align-items:flex-start; }
    .pagehead h1{ font-size:20px; }
    .card{ padding:14px; }
    #main{ padding:62px 12px 36px 12px; }
    table{ font-size:12.5px; }
    th{ padding:7px 6px; }
    td{ padding:8px 6px; }
    .searchbar{ max-width:none; }
    .itemhead{ display:none; }
    .itemrow{
      grid-template-columns:1fr 1fr 1fr auto; row-gap:6px; column-gap:6px;
      grid-template-areas:"product product product rm" "qty price total total";
      align-items:center; padding-bottom:10px; margin-bottom:10px; border-bottom:1px dashed var(--line);
    }
    .itemrow > *:nth-child(1){ grid-area:product; }
    .itemrow > *:nth-child(2){ grid-area:qty; }
    .itemrow > *:nth-child(3){ grid-area:price; }
    .itemrow > *:nth-child(4){ grid-area:total; text-align:right; font-weight:600; }
    .itemrow > *:nth-child(5){ grid-area:rm; justify-self:end; }
  }
  /* Ensure wide tables scroll horizontally instead of crushing columns */
  @media (max-width:900px){
    .card{ overflow-x:auto; -webkit-overflow-scrolling:touch; }
    .card table{ min-width:560px; }
    #invoice-paper, #gst-invoice{ min-width:0; }
  }
  /* Prevent iOS Safari auto-zoom on input focus, and give touch-friendly tap targets */
  @media (max-width:880px){
    input[type=text],input[type=number],input[type=tel],input[type=date],input[type=email],select,textarea{
      font-size:16px; padding:10px 11px;
    }
    .btn{ padding:10px 16px; }
    .btn.sm{ padding:8px 12px; }
    .navbtn{ padding:12px 12px; font-size:14.5px; }
    button, a, input, select{ touch-action:manipulation; }
  }
  @media (max-width:420px){
    .kpis{ grid-template-columns:1fr; }
  }
</style>
</head>

<body>

<div id="login-screen" style="display:none;">
  <div class="login-card">
    <h1>My Mobile Shop</h1>
    <div class="sub">Sign in with the username &amp; password given by your admin</div>
    <div class="login-error" id="login-error"></div>
    <div class="field"><label>Username</label><input type="text" id="login-email" autocomplete="username" autocapitalize="off" spellcheck="false"></div>
    <div class="field"><label>Password</label><input type="password" id="login-password" autocomplete="current-password"></div>
    <button class="btn primary" id="login-submit">Sign In</button>
  </div>
</div>

<div id="app" style="display:none;">
  <div class="mobile-topbar" id="mobile-topbar">
    <button class="hamburger" id="hamburger-btn" aria-label="Open menu"><span></span><span></span><span></span></button>
    <div class="mt-title" id="mt-title">Shop Ledger</div>
  </div>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  <nav id="sidebar">
    <div class="brand">
      <div class="mark">&#128241;</div>
      <div>
        <div class="name" id="sb-shopname">Shop Ledger</div>
        <div class="sub">Mobile shop billing</div>
      </div>
    </div>

// One-time backfill: older data may have an IMEI typed straight into a product's
// own "IMEI / Serial" field (via Edit Product) without ever going through Purchase
// Entry or "+ Add IMEI", so it never became a trackable, sellable unit. Pull those in.
function migrateProductImeiFields(){
  let changed = false;
  (state.products||[]).forEach(p=>{
    const imei = (p.imei||'').trim();

function saveState(){

function uid(prefix){ return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function fmtDate(iso){ if(!iso) return '-'; const d=new Date(iso+'T00:00:00'); return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}); }
function money(n){ n = Number(n)||0; return '₹' + n.toLocaleString('en-IN',{maximumFractionDigits:2, minimumFractionDigits: (n%1!==0)?2:0}); }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* Indian-style number-to-words, e.g. 59300 -> "Fifty Nine Thousand Three Hundred" */
function numberToWordsIndian(num){
  num = Math.floor(Math.abs(Number(num)||0));
  if(num===0) return 'Zero';
  const ones=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const tens=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  function twoDigits(n){
    if(n<20) return ones[n];
    return tens[Math.floor(n/10)] + (n%10? ' '+ones[n%10] : '');
  }
  function threeDigits(n){
    if(n<100) return twoDigits(n);
    return ones[Math.floor(n/100)] + ' Hundred' + (n%100? ' '+twoDigits(n%100) : '');
  }
  const crore = Math.floor(num/10000000); num%=10000000;
  const lakh = Math.floor(num/100000); num%=100000;
  const thousand = Math.floor(num/1000); num%=1000;
  const hundred = num;
  let parts=[];
  if(crore) parts.push(threeDigits(crore)+' Crore');
  if(lakh) parts.push(threeDigits(lakh)+' Lakh');
  if(thousand) parts.push(threeDigits(thousand)+' Thousand');
  if(hundred) parts.push(threeDigits(hundred));
  return parts.join(' ');
}
function amountInWords(n){
  n = Number(n)||0;
  const rupees = Math.floor(n);
  const paise = Math.round((n-rupees)*100);
  let words = 'INR ' + numberToWordsIndian(rupees);
  if(paise>0) words += ' and ' + numberToWordsIndian(paise) + ' Paise';
  return words + ' Only';
}

function nextInvoiceNo(){ return 'INV-' + String(state.counters.invoice).padStart(4,'0'); }
function nextPurchaseNo(){ return 'PUR-' + String(state.counters.purchase).padStart(4,'0'); }

/* =========================================================
   DERIVED DATA HELPERS
   ========================================================= */
function productById(id){ return state.products.find(p=>p.id===id); }

function customerKey(c){ return (c.phone||c.name||'walk-in').trim().toLowerCase() || 'walk-in'; }

function customerLedgerList(){
  const map = {};
  // Start from explicitly registered customers, so the ledger is a full
  // customer directory — not just names that happen to have a bill.
  (state.customers||[]).forEach(c=>{
    const key = customerKey(c);
    map[key] = { key, name:c.name||'Walk-in', phone:c.phone||'', address:c.address||'', email:c.email||'', notes:c.notes||'', registered:true, billed:0, paid:0, count:0, last:'' };
  });
  state.sales.forEach(s=>{
    const key = (s.customerPhone||s.customer||'walk-in').trim().toLowerCase() || 'walk-in';
    if(!map[key]) map[key] = { key, name:s.customer||'Walk-in', phone:s.customerPhone||'', billed:0, paid:0, count:0, last:s.date };
    map[key].billed += s.total;
    map[key].paid += s.paid;
    map[key].count += 1;
    if(s.date > map[key].last) map[key].last = s.date;
    if(s.customer && !map[key].registered) map[key].name = s.customer;
    if(s.customerPhone && !map[key].registered) map[key].phone = s.customerPhone;
  });
  state.payments.filter(p=>p.partyType==='customer').forEach(p=>{
    const key = (p.partyKey||'').trim().toLowerCase();
    if(map[key]) map[key].paid += p.amount;
  });
  return Object.values(map).map(c=>({...c, due: c.billed - c.paid})).sort((a,b)=> b.due - a.due);
}

function customerById(key){ return (state.customers||[]).find(c=> customerKey(c)===key); }

/* =========================================================
   IMEI / SERIAL TRACKING HELPERS
   ========================================================= */
function imeiUnitsForProduct(productId, status){
  return (state.imeiUnits||[]).filter(u=> u.productId===productId && (!status || u.status===status));
}
function parseImeiLines(text){
  return String(text||'').split(/[\n,]/).map(s=>s.trim()).filter(Boolean);
}
function addImeiUnitsFromPurchase(productId, productName, imeiText, purchaseId, purchaseDate){
  const list = parseImeiLines(imeiText);
  list.forEach(imei=>{
    if((state.imeiUnits||[]).some(u=>u.imei.toLowerCase()===imei.toLowerCase())) return; // avoid duplicates
    state.imeiUnits.push({ id: uid('imei'), imei, productId, productName, status:'in_stock', purchaseId, purchaseDate, saleId:null, saleDate:null, customer:'', customerPhone:'' });
  });
}
function markImeiUnitSold(imeiUnitId, saleId, saleDate, customer, customerPhone){
  const u = (state.imeiUnits||[]).find(x=>x.id===imeiUnitId);
  if(!u) return;
  u.status = 'sold'; u.saleId = saleId; u.saleDate = saleDate; u.customer = customer; u.customerPhone = customerPhone;
}
function revertImeiUnitsForSale(saleId){
  (state.imeiUnits||[]).forEach(u=>{
    if(u.saleId===saleId){ u.status='in_stock'; u.saleId=null; u.saleDate=null; u.customer=''; u.customerPhone=''; }
  });
}

function supplierLedgerList(){
  const map = {};
  state.purchases.forEach(p=>{
    const key = (p.supplier||'unknown').trim().toLowerCase();
    if(!map[key]) map[key] = { key, name:p.supplier||'Unknown', billed:0, paid:0, count:0, last:p.date };
    map[key].billed += p.total;
    map[key].paid += p.paid;
    map[key].count += 1;
    if(p.date > map[key].last) map[key].last = p.date;
  });
  state.payments.filter(p=>p.partyType==='supplier').forEach(p=>{
    const key = (p.partyKey||'').trim().toLowerCase();
    if(map[key]) map[key].paid += p.amount;
  });
  return Object.values(map).map(c=>({...c, due: c.billed - c.paid})).sort((a,b)=> b.due - a.due);
}

/* Full, transaction-level ledger for a single customer or supplier: every
   sale/purchase and every payment, in date order, with a running balance. */
function partyTransactions(type, key){
  const entries = [];
  if(type==='customer'){
    state.sales.forEach(s=>{
      const k = (s.customerPhone||s.customer||'walk-in').trim().toLowerCase() || 'walk-in';
      if(k!==key) return;
      entries.push({ date:s.date, type:'Sale', ref:s.invoiceNo, debit:s.total, credit:0, note:`${s.items.length} item(s)`, ts:s.id });
      if(s.paid>0) entries.push({ date:s.date, type:'Payment', ref:s.invoiceNo, debit:0, credit:s.paid, note:`Paid at billing (${s.paymentMode})`, ts:s.id+'_p' });
    });
    state.payments.filter(p=>p.partyType==='customer' && (p.partyKey||'').trim().toLowerCase()===key).forEach(p=>{
      entries.push({ date:p.date, type:'Payment', ref:p.mode, debit:0, credit:p.amount, note:p.note||'', ts:p.id });
    });
  }else{
    state.purchases.forEach(p=>{
      const k = (p.supplier||'unknown').trim().toLowerCase();
      if(k!==key) return;
      entries.push({ date:p.date, type:'Purchase', ref:p.invoiceNo, debit:p.total, credit:0, note:`${p.items.length} item(s)`, ts:p.id });
      if(p.paid>0) entries.push({ date:p.date, type:'Payment', ref:p.invoiceNo, debit:0, credit:p.paid, note:'Paid at purchase', ts:p.id+'_p' });
    });
    state.payments.filter(p=>p.partyType==='supplier' && (p.partyKey||'').trim().toLowerCase()===key).forEach(p=>{
      entries.push({ date:p.date, type:'Payment', ref:p.mode, credit:p.amount, debit:0, note:p.note||'', ts:p.id });
    });
  }
  entries.sort((a,b)=> a.date.localeCompare(b.date) || String(a.ts).localeCompare(String(b.ts)));
  let bal = 0;
  entries.forEach(e=>{ bal += e.debit - e.credit; e.balance = bal; });
  return entries;
}

function monthKey(iso){ return iso.slice(0,7); }

function monthlyReport(ym){
  const salesM = state.sales.filter(s=>monthKey(s.date)===ym);
  const purchM = state.purchases.filter(p=>monthKey(p.date)===ym);
  const totalSales = salesM.reduce((a,s)=>a+s.total,0);
  const totalCollected = salesM.reduce((a,s)=>a+s.paid,0);
  const totalDue = totalSales - totalCollected;
  const totalPurchase = purchM.reduce((a,p)=>a+p.total,0);
  let cost = 0;
  const productSold = {};
  salesM.forEach(s=> s.items.forEach(it=>{
    const p = productById(it.productId);
    const c = p ? (Number(p.purchasePrice)||0) : 0;
    cost += c * it.qty;
    productSold[it.name] = (productSold[it.name]||0) + it.qty;
  }));
  const profit = totalSales - cost;
  const topProducts = Object.entries(productSold).sort((a,b)=>b[1]-a[1]).slice(0,5);
  return { salesM, purchM, totalSales, totalCollected, totalDue, totalPurchase, profit, topProducts };
}

   ========================================================= */
function viewDashboard(){
  const today = todayISO();
  const ym = today.slice(0,7);
  const salesToday = state.sales.filter(s=>s.date===today);
  const rep = monthlyReport(ym);
  const custDue = customerLedgerList().reduce((a,c)=>a+Math.max(c.due,0),0);
  const suppDue = supplierLedgerList().reduce((a,c)=>a+Math.max(c.due,0),0);
  const lowStock = state.products.filter(p => Number(p.stock) <= Number(p.minStock||2));
  const recentSales = [...state.sales].sort((a,b)=> b.date.localeCompare(a.date) || b.invoiceNo.localeCompare(a.invoiceNo)).slice(0,6);

  return `
    <div class="pagehead">
      <div><h1>Dashboard</h1><div class="desc">${fmtDate(today)} — overview of your shop today</div></div>
      <button class="btn primary" data-action="go-sales">+ New Sale</button>
    </div>
    <div class="kpis">
      <div class="kpi info"><div class="label">Today's Sales</div><div class="value">${money(salesToday.reduce((a,s)=>a+s.total,0))}</div><div class="sub">${salesToday.length} bill${salesToday.length===1?'':'s'}</div></div>
      <div class="kpi good"><div class="label">This Month Sales</div><div class="value">${money(rep.totalSales)}</div><div class="sub">Profit est. ${money(rep.profit)}</div></div>
      <div class="kpi bad"><div class="label">Customer Dues</div><div class="value" style="color:var(--bad)">${money(custDue)}</div><div class="sub">To be collected</div></div>
      <div class="kpi bad"><div class="label">Supplier Dues</div><div class="value" style="color:var(--bad)">${money(suppDue)}</div><div class="sub">To be paid out</div></div>
    </div>
    <div class="grid cols-2">
      <div class="card">
        <div class="row-between"><h2>Recent Bills</h2><button class="btn ghost sm" data-action="go-sales">View all →</button></div>
        ${recentSales.length===0? emptyState('No sales yet','Create your first bill from Billing / Sale.') : `
        <table><thead><tr><th>Invoice</th><th>Customer</th><th class="num">Total</th><th>Status</th></tr></thead><tbody>
        ${recentSales.map(s=>`<tr><td class="num">${s.invoiceNo}</td><td>${esc(s.customer||'Walk-in')}</td><td class="num">${money(s.total)}</td><td>${dueStatusPill(s.total - s.paid)}</td></tr>`).join('')}
        </tbody></table>`}
      </div>
      <div class="card">
        <div class="row-between"><h2>Low Stock Alerts</h2><button class="btn ghost sm" data-action="go-products">Manage stock →</button></div>
        ${lowStock.length===0? emptyState('Stock looks healthy','No products are below their minimum stock level.') : `
        <table><thead><tr><th>Product</th><th class="num">Stock</th><th class="num">Min</th></tr></thead><tbody>
        ${lowStock.map(p=>`<tr><td>${esc(p.name)}</td><td class="num">${p.stock}</td><td class="num">${p.minStock||2}</td></tr>`).join('')}
        </tbody></table>`}
      </div>
    </div>
  `;
}
function dueStatusPill(due){
  if(due<=0) return `<span class="pill good">Paid</span>`;
  return `<span class="pill bad">Due ${money(due)}</span>`;
}
function emptyState(title, sub){
  return `<div class="empty"><div class="big">—</div><div style="font-weight:600">${esc(title)}</div><div style="font-size:12.5px;margin-top:4px;">${esc(sub)}</div></div>`;
}

function imeiToCsv(){
  const rows = [['IMEI','Product','Status','Purchase Date','Sale Date','Customer','Customer Phone']];
  (state.imeiUnits||[]).forEach(u=> rows.push([u.imei,u.productName||'',u.status,u.purchaseDate||'',u.saleDate||'',u.customer||'',u.customerPhone||'']));
  return rows.map(r=> r.map(v=> `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
}
function exportImeiCsv(){
  const csv = imeiToCsv();
  const blob = new Blob([csv], { type:'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `imei-tracking-${todayISO()}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function saleItemRow(it,i){
  const options = state.products.map(p=>`<option value="${p.id}" ${it.productId===p.id?'selected':''} data-price="${p.salePrice}">${esc(p.name)} (stock ${p.stock})</option>`).join('');
  const qty = Math.max(1, Number(it.qty)||0);
  if(!Array.isArray(it.imeiUnitIds)) it.imeiUnitIds = [];
  while(it.imeiUnitIds.length < qty) it.imeiUnitIds.push('');
  if(it.imeiUnitIds.length > qty) it.imeiUnitIds.length = qty;

  let costHint = '';
  let imeiSection = '';
  if(it.productId){
    const prod = productById(it.productId);
    if(prod){
      const cost = Number(prod.purchasePrice)||0;
      const marginEach = (Number(it.price)||0) - cost;
      const marginTotal = marginEach * qty;
      costHint = `<div class="imei-hint" style="margin:-4px 0 8px 0;">Cost price: <strong class="num">${money(cost)}</strong> / unit &nbsp;·&nbsp; Est. margin: <strong class="num" style="color:${marginTotal>=0?'var(--good)':'var(--bad)'}">${money(marginTotal)}</strong></div>`;
    }
    const availUnits = imeiUnitsForProduct(it.productId,'in_stock');
    const usedElsewhere = new Set();
    saleItems.forEach((otherIt,oi)=>{
      if(oi===i) return;
      (otherIt.imeiUnitIds||[]).forEach(id=>{ if(id) usedElsewhere.add(id); });
    });
    let shortageWarning = '';
    if(availUnits.length < qty){
      shortageWarning = `<div class="imei-hint" style="color:var(--bad); font-weight:600; margin:4px 0 8px 0;">Only ${availUnits.length} tracked IMEI unit${availUnits.length===1?'':'s'} in stock for this product — need ${qty}. Add the missing unit(s) via IMEI Tracking → “+ Add IMEI” (or the product's own IMEI/Serial field), or lower the quantity.</div>`;
    }
    const rows = it.imeiUnitIds.map((val, ui)=>{
      const usedInThisItem = new Set(it.imeiUnitIds.filter((v,vi)=> vi!==ui && v));
      const opts = availUnits
        .filter(u=> u.id===val || (!usedElsewhere.has(u.id) && !usedInThisItem.has(u.id)))
        .map(u=>`<option value="${u.id}" ${val===u.id?'selected':''}>${esc(u.imei)}</option>`).join('');
      return `<select class="sa-imei" data-i="${i}" data-u="${ui}" required><option value="">Select IMEI${qty>1?` — unit ${ui+1}`:''}…</option>${opts}</select>`;
    }).join('');
    imeiSection = `${shortageWarning}<div class="imei-box">
      <label>IMEI / Serial <span style="color:var(--bad);">*</span> — required, one per unit sold</label>
      <div style="display:flex; flex-direction:column; gap:6px;">${rows}</div>
    </div>`;
  }
  return `
  <div class="itemrow" data-row="${i}">
    <select class="sa-product" data-i="${i}"><option value="">Select product…</option>${options}</select>
    <input type="number" class="sa-qty" data-i="${i}" value="${it.qty}" min="1">
    <input type="number" class="sa-price" data-i="${i}" value="${it.price}" min="0">
    <div class="num" style="padding:8px 0;">${money((Number(it.qty)||0)*(Number(it.price)||0))}</div>
    <button class="rm" data-action="sa-rm-row" data-i="${i}" title="Remove">&times;</button>
  </div>
  ${costHint}${imeiSection}`;
}

function doRemoveUser(username){
  if(!isAdmin()) return;
  const rec = state.users.find(u=>u.username===username);
  if(!rec) return;
  if(rec.role==='admin' && state.users.filter(u=>u.role==='admin').length<=1){
    alert('At least one admin must remain — add another admin before removing this one.');
    return;
  }
  if(!confirm(`Remove access for "${username}"? They will no longer be able to sign in.`)) return;
  state.users = state.users.filter(u=>u.username!==username);
  saveState(); render();
}

function doDeleteCustomer(key){
  if(!isAdmin()) return;
  const rec = (state.customers||[]).find(c=> customerKey(c)===key);
  if(!rec) return;
  const hasHistory = state.sales.some(s=> (s.customerPhone||s.customer||'walk-in').trim().toLowerCase()===key)
    || state.payments.some(p=> p.partyType==='customer' && (p.partyKey||'').trim().toLowerCase()===key);
  const warn = hasHistory
    ? `Delete "${rec.name}"? Their saved contact details will be removed, but past bills and payments will stay in the ledger under this name/phone.`
    : `Delete customer "${rec.name}"? This cannot be undone.`;
  if(!confirm(warn)) return;
  state.customers = state.customers.filter(c=> customerKey(c)!==key);
  saveState(); render();
}

function doSaveEditedSale(){
  if(!isAdmin()) return;
  const s = state.sales.find(x=>x.id===editSaleId);
  if(!s) return;
  const customer = document.getElementById('es-customer').value.trim();
  const customerPhone = document.getElementById('es-phone').value.trim();
  const customerAddress = document.getElementById('es-address').value.trim();
  const date = document.getElementById('es-date').value || s.date;
  const discount = Number(document.getElementById('es-discount').value) || 0;
  const paymentMode = document.getElementById('es-mode').value;

  // Return the original items' stock first, so validation below sees true availability
  s.items.forEach(it=>{ const prod = productById(it.productId); if(prod) prod.stock = Number(prod.stock) + it.qty; });

  const items = [];
  let error = '';
  editSaleItems.forEach(it=>{
    const qty = Number(it.qty)||0;
    const price = Number(it.price)||0;
    if(!it.productId || qty<=0) return;
    const prod = productById(it.productId);
    if(!prod) return;
    if(qty > Number(prod.stock)){ error = `Not enough stock for "${prod.name}" (available: ${prod.stock}).`; return; }
    items.push({ productId: it.productId, name: prod.name, qty, price });
  });

  if(error || items.length===0){
    // undo the stock-return above since we're bailing out
    s.items.forEach(it=>{ const prod = productById(it.productId); if(prod) prod.stock = Number(prod.stock) - it.qty; });
    alert(error || 'Add at least one item to the bill.');
    return;
  }

  items.forEach(it=>{ const prod = productById(it.productId); prod.stock = Number(prod.stock) - it.qty; });

  const subtotal = items.reduce((a,it)=>a+it.qty*it.price,0);
  const total = Math.max(subtotal - discount, 0);
  let paid = Number(document.getElementById('es-paid').value);
  if(isNaN(paid)) paid = total;

  s.customer = customer;
  s.customerPhone = customerPhone;
  s.customerAddress = customerAddress;
  s.date = date;
  s.items = items;
  s.subtotal = subtotal;
  s.discount = discount;
  s.total = total;
  s.paid = paid;
  s.paymentMode = paymentMode;

  saveState();
  closeModal();
  render();
}

function doDeleteSale(saleId){
  if(!isAdmin()) return;
  const s = state.sales.find(x=>x.id===saleId);
  if(!s) return;
  if(!confirm(`Delete bill ${s.invoiceNo}? This restocks its items and cannot be undone.`)) return;
  s.items.forEach(it=>{ const prod = productById(it.productId); if(prod) prod.stock = Number(prod.stock) + it.qty; });
  revertImeiUnitsForSale(saleId);
  state.sales = state.sales.filter(x=>x.id!==saleId);
  saveState();
  render();
}

/* Builds a formal "TAX INVOICE" in the classic GST-billing-software layout:
   Sl No / Description / HSN-SAC / Qty / Rate(incl. tax) / Rate per unit(taxable) / Amount(taxable),
   followed by CGST+SGST, round-off, discount, grand total, amount in words,
   an HSN-wise tax summary, bank details and a signature block. */
function gstInvoiceHtml(s, c){
  const taxRate = Number(c.gstRate)||18;
  const halfRate = taxRate/2;
  let taxableSum = 0;
  let totalQty = 0;
  const rows = s.items.map((it, i)=>{
    const prod = productById(it.productId);
    const hsn = prod && prod.hsn ? prod.hsn : '';
    const unitIncl = Number(it.price)||0;
    const unitTaxable = unitIncl / (1+taxRate/100);
    const lineTaxable = unitTaxable * it.qty;
    taxableSum += lineTaxable;
    totalQty += Number(it.qty)||0;
    const desc = [esc(it.name)];
    if(it.imeiUnitIds && it.imeiUnitIds.length){
      const imeis = it.imeiUnitIds.map(id=>{const u=(state.imeiUnits||[]).find(x=>x.id===id); return u?u.imei:'';}).filter(Boolean);
      if(imeis.length) desc.push(`<span class="desc-code">IMEI: ${esc(imeis.join(', '))}</span>`);
    } else if(prod && prod.imei) desc.push(`<span class="desc-code">${esc(prod.imei)}</span>`);
    return { hsn, row: `<tr>
        <td class="center">${i+1}</td>
        <td>${desc.join('')}</td>
        <td class="center">${esc(hsn)}</td>
        <td class="num">${it.qty} PCS</td>
        <td class="num">${money(unitIncl)}</td>
        <td class="num">${money(unitTaxable)}</td>
        <td class="center">-</td>
        <td class="num">${money(lineTaxable)}</td>
      </tr>`, taxable: lineTaxable };
  });

  const cgst = taxableSum * halfRate/100;
  const sgst = taxableSum * halfRate/100;
  const beforeRound = taxableSum + cgst + sgst;
  const discount = Number(s.discount)||0;
  const roundOff = s.total - (beforeRound - discount);
  const due = s.total - s.paid;
  const totalTax = cgst + sgst;

  // HSN-wise tax summary
  const hsnMap = {};
  rows.forEach(r=>{
    const key = r.hsn || '—';
    if(!hsnMap[key]) hsnMap[key] = 0;
    hsnMap[key] += r.taxable;
  });
  const hsnRows = Object.keys(hsnMap).map(hsn=>{
    const val = hsnMap[hsn];
    const c1 = val*halfRate/100, c2 = val*halfRate/100;
    return `<tr><td>${esc(hsn)}</td><td class="num">${money(val)}</td><td class="center">${halfRate}%</td><td class="num">${money(c1)}</td><td class="center">${halfRate}%</td><td class="num">${money(c2)}</td><td class="num">${money(c1+c2)}</td></tr>`;
  }).join('');

  const buyerLines = [esc(s.customer||'Walk-in Customer')];
  if(s.customerAddress) buyerLines.push(esc(s.customerAddress));
  if(c.stateName) buyerLines.push('State Name: '+esc(c.stateName)+(c.stateCode?(', Code: '+esc(c.stateCode)):''));
  if(s.customerPhone) buyerLines.push('Contact: '+esc(s.customerPhone));

  return `
  <div id="gst-invoice">
    <div class="gi-title">TAX INVOICE</div>
    <table class="gi-tbl">
      <tr>
        <td style="width:56%;">
          <div class="gi-shopname">${esc(c.name||'My Shop')}</div>
          <div class="gi-shopmeta">
            ${esc(c.address||'')}${c.address?'<br>':''}
            ${c.phone?('Ph: '+esc(c.phone)+'<br>'):''}
            ${c.gst?('GSTIN/UIN: '+esc(c.gst)+'<br>'):''}
            ${c.stateName?('State Name: '+esc(c.stateName)+(c.stateCode?(', Code: '+esc(c.stateCode)):'')+'<br>'):''}
            ${c.email?('E-Mail: '+esc(c.email)):''}
          </div>
        </td>
        <td>
          <div><span class="gi-label">Invoice No.</span><br><span class="gi-strong">${esc(s.invoiceNo)}</span></div>
          <div style="margin-top:6px;"><span class="gi-label">Reference No. &amp; Date.</span></div>
        </td>
        <td>
          <div><span class="gi-label">Dated</span><br><span class="gi-strong">${fmtDate(s.date)}</span></div>
          <div style="margin-top:6px;"><span class="gi-label">Other References</span></div>
        </td>
      </tr>
      <tr>
        <td>
          <div class="gi-label">Buyer (Bill to)</div>
          <div class="gi-strong">${buyerLines.join('<br>')}</div>
        </td>
        <td colspan="2"><span class="gi-label">Payment Mode</span><br>${esc(s.paymentMode||'-')}</td>
      </tr>
    </table>

    <table class="gi-tbl items-tbl">
      <thead>
        <tr>
          <th style="width:5%;">Sl<br>No.</th>
          <th>Description of Goods</th>
          <th style="width:9%;">HSN/SAC</th>
          <th style="width:8%;">Quantity</th>
          <th style="width:11%;">Rate<br>(Incl. of Tax)</th>
          <th style="width:11%;">Rate per Unit</th>
          <th style="width:6%;">Disc.<br>%</th>
          <th style="width:12%;">Amount</th>
        </tr>
      </thead>
      <tbody>
        ${rows.map(r=>r.row).join('')}
        <tr><td colspan="8" style="height:120px; border-left:1px solid #000; border-right:1px solid #000;">&nbsp;</td></tr>
        <tr><td colspan="7" style="text-align:right;">&nbsp;</td><td class="num">${money(taxableSum)}</td></tr>
        <tr><td colspan="7" style="text-align:center; font-style:italic;">CGST</td><td class="num">${money(cgst)}</td></tr>
        <tr><td colspan="7" style="text-align:center; font-style:italic;">SGST</td><td class="num">${money(sgst)}</td></tr>
        ${discount>0?`<tr><td colspan="7" style="text-align:center; font-style:italic;">Less: Discount</td><td class="num">(-) ${money(discount)}</td></tr>`:''}
        ${Math.abs(roundOff)>=0.005?`<tr><td colspan="7" style="text-align:center; font-style:italic;">Round Off</td><td class="num">${roundOff<0?'(-) ':''}${money(Math.abs(roundOff))}</td></tr>`:''}
        <tr style="font-weight:700;">
          <td style="border-top:1px solid #000;"></td>
          <td style="border-top:1px solid #000;">Total</td>
          <td style="border-top:1px solid #000;"></td>
          <td class="num" style="border-top:1px solid #000;">${totalQty} PCS</td>
          <td style="border-top:1px solid #000;"></td>
          <td style="border-top:1px solid #000;"></td>
          <td style="border-top:1px solid #000;"></td>
          <td class="num" style="border-top:1px solid #000;">Rs ${money(s.total)}</td>
        </tr>
      </tbody>
    </table>

    <div class="gi-words">
      <div class="lbl">Amount Chargeable (in words)</div>
      <div class="gi-strong">${amountInWords(s.total)}</div>
    </div>

    ${hsnRows ? `
    <table class="gi-tbl" style="margin-top:-1px;">
      <thead><tr>
        <th>HSN/SAC</th><th>Taxable Value</th><th>CGST Rate</th><th>CGST Amt</th><th>SGST Rate</th><th>SGST Amt</th><th>Total Tax</th>
      </tr></thead>
      <tbody>${hsnRows}</tbody>
    </table>` : ''}

    <div class="gi-words" style="border-top:none;">
      <div class="lbl">Tax Amount (in words)</div>
      <div class="gi-strong">${amountInWords(totalTax)}</div>
    </div>

    <div class="gi-bottom">
      <div class="qr-col">
        <div class="gi-label">Paid</div>
        <div>${money(s.paid)}</div>
        <div class="gi-label" style="margin-top:6px;">Balance Due</div>
        <div class="gi-strong">${money(due)}</div>
        <div class="gi-label" style="margin-top:10px;">Company's PAN</div>
        <div class="gi-strong">${esc(c.pan||'-')}</div>
        <div class="gi-label" style="margin-top:10px;">Declaration</div>
        <div style="font-size:10px;">We declare that this invoice shows the actual price of the goods described and that all particulars are true and correct.</div>
      </div>
      <div class="bank-col">
        <div class="bank-details">
          ${(c.bankAccName||c.bankName||c.bankAccNo)?`
          <strong>Company's Bank Details</strong><br>
          ${c.bankAccName?("A/c Holder's Name: "+esc(c.bankAccName)+"<br>"):''}
          ${c.bankName?("Bank Name: "+esc(c.bankName)+"<br>"):''}
          ${c.bankAccNo?("A/c No.: "+esc(c.bankAccNo)+"<br>"):''}
          ${c.bankIFSC?("Branch &amp; IFS Code: "+esc(c.bankIFSC)):''}
          `:''}
        </div>
        <div class="gi-sign">
          for ${esc(c.name||'')}<br><br><br>
          Authorised Signatory
        </div>
      </div>
    </div>
    ${c.jurisdiction? `<div class="gi-footer">${esc(c.jurisdiction)}</div>` : ''}
    <div class="gi-footer2">This is a Computer Generated Invoice</div>
  </div>`;
}

function printInvoice(saleId){
  const s = state.sales.find(x=>x.id===saleId);
  if(!s) return;
  const c = state.company;
  const useGst = !!(c.gst && c.gst.trim());
  const html = useGst ? gstInvoiceHtml(s, c) : plainInvoiceHtml(s, c);
  const modal = document.getElementById('modal-root');
  modal.innerHTML = `<div class="modal-bg" data-close="modal"><div class="modal wide" data-stop style="max-width:${useGst?'820px':'620px'};">
    <div class="modal-head no-print"><h2>Bill Preview</h2>
      <div>
        <button class="btn sm primary" data-action="do-print">Print</button>
        <button class="modal-close" data-close="modal" style="margin-left:8px;">&times;</button>
      </div>
    </div>
    ${html}
  </div></div>`;
  attachModalHandlers();
}

/* =========================================================

  main.querySelectorAll('[data-action="go-sales"]').forEach(b=>b.addEventListener('click', ()=>switchTab('sales')));

  // Company
  const saveCompanyBtn = main.querySelector('[data-action="save-company"]');
  if(saveCompanyBtn) saveCompanyBtn.addEventListener('click', ()=>{
    state.company = {
      name: document.getElementById('c-name').value.trim() || 'My Mobile Shop',
      address: document.getElementById('c-address').value.trim(),
      phone: document.getElementById('c-phone').value.trim(),
      email: document.getElementById('c-email').value.trim(),
      gst: document.getElementById('c-gst').value.trim(),
      stateName: document.getElementById('c-statename').value.trim(),
      stateCode: document.getElementById('c-statecode').value.trim(),

      bankName: document.getElementById('c-bankname').value.trim(),
      bankAccNo: document.getElementById('c-bankaccno').value.trim(),
      bankIFSC: document.getElementById('c-bankifsc').value.trim(),
    };
    saveState(); render();
  });

  // Products
  const prodSearch = main.querySelector('#prod-search');
  if(prodSearch) prodSearch.addEventListener('input', e=>{ productFilter = e.target.value; render(); });
  const addProdBtn = main.querySelector('[data-action="add-product"]');
  if(addProdBtn) addProdBtn.addEventListener('click', ()=> openModal(productFormModal(null)));
  main.querySelectorAll('[data-action="edit-product"]').forEach(b=>b.addEventListener('click', ()=>{
    openModal(productFormModal(productById(b.dataset.id)));
  }));
  main.querySelectorAll('[data-action="del-product"]').forEach(b=>b.addEventListener('click', ()=>{
    if(confirm('Delete this product? This cannot be undone.')){
      state.products = state.products.filter(p=>p.id!==b.dataset.id);
      saveState(); render();
    }

  main.querySelectorAll('[data-action="imei-filter"]').forEach(b=>b.addEventListener('click', ()=>{ imeiStatusFilter = b.dataset.status; render(); }));
  const addImeiBtn = main.querySelector('[data-action="add-imei"]');
  if(addImeiBtn) addImeiBtn.addEventListener('click', ()=> openModal(imeiFormModal(null)));
  main.querySelectorAll('[data-action="edit-imei"]').forEach(b=>b.addEventListener('click', ()=>{
    const u = (state.imeiUnits||[]).find(x=>x.id===b.dataset.id);
    if(u) openModal(imeiFormModal(u));
  }));
  main.querySelectorAll('[data-action="del-imei"]').forEach(b=>b.addEventListener('click', ()=>{
    if(confirm('Delete this IMEI record? This cannot be undone.')){
      state.imeiUnits = state.imeiUnits.filter(u=>u.id!==b.dataset.id);
      saveState(); render();
    }
  }));
  const imeiExportBtn = main.querySelector('[data-action="imei-export"]');
  if(imeiExportBtn) imeiExportBtn.addEventListener('click', exportImeiCsv);

  // Purchase
  const puAddRow = main.querySelector('[data-action="pu-add-row"]');
  if(puAddRow) puAddRow.addEventListener('click', ()=>{ purchaseItems.push({productId:'',name:'',qty:1,price:0,imeiText:'',imeiOpen:false}); render(); });
  main.querySelectorAll('[data-action="pu-rm-row"]').forEach(b=>b.addEventListener('click', ()=>{
    purchaseItems.splice(Number(b.dataset.i),1);
    if(purchaseItems.length===0) purchaseItems.push({productId:'',name:'',qty:1,price:0,imeiText:'',imeiOpen:false});
    render();
  }));

    const i = Number(b.dataset.i);
    purchaseItems[i].imeiOpen = !purchaseItems[i].imeiOpen;
    render();
  }));
  main.querySelectorAll('.pu-imei').forEach(ta=>{
    ta.addEventListener('input', e=>{ purchaseItems[Number(e.target.dataset.i)].imeiText = e.target.value; });
    ta.addEventListener('change', ()=> render());
  });
  main.querySelectorAll('.pu-product').forEach(sel=>sel.addEventListener('change', e=>{
    const i = Number(e.target.dataset.i);
    purchaseItems[i].productId = e.target.value;
    if(e.target.value){
      const p = productById(e.target.value);
      purchaseItems[i].name = p.name;
      purchaseItems[i].price = p.purchasePrice;
    }
    render();
  }));
  main.querySelectorAll('.pu-qty').forEach(inp=>inp.addEventListener('input', e=>{ purchaseItems[Number(e.target.dataset.i)].qty = e.target.value; syncPurchaseTotalsOnly(); }));
  main.querySelectorAll('.pu-qty').forEach(inp=>inp.addEventListener('change', ()=> render()));
  main.querySelectorAll('.pu-price').forEach(inp=>inp.addEventListener('input', e=>{ purchaseItems[Number(e.target.dataset.i)].price = e.target.value; syncPurchaseTotalsOnly(); }));
  const savePurchaseBtn = main.querySelector('[data-action="save-purchase"]');
  if(savePurchaseBtn) savePurchaseBtn.addEventListener('click', doSavePurchase);

  // Sales
  const saAddRow = main.querySelector('[data-action="sa-add-row"]');
  if(saAddRow) saAddRow.addEventListener('click', ()=>{ saleItems.push({productId:'',qty:1,price:0,imeiUnitIds:[]}); render(); });
  main.querySelectorAll('[data-action="sa-rm-row"]').forEach(b=>b.addEventListener('click', ()=>{
    saleItems.splice(Number(b.dataset.i),1);
    if(saleItems.length===0) saleItems.push({productId:'',qty:1,price:0,imeiUnitIds:[]});
    render();
  }));
  main.querySelectorAll('.sa-product').forEach(sel=>sel.addEventListener('change', e=>{
    const i = Number(e.target.dataset.i);
    saleItems[i].productId = e.target.value;
    saleItems[i].imeiUnitIds = [];
    if(e.target.value){
      const p = productById(e.target.value);
      saleItems[i].price = p.salePrice;
    }
    render();
  }));
  main.querySelectorAll('.sa-qty').forEach(inp=>inp.addEventListener('input', e=>{ saleItems[Number(e.target.dataset.i)].qty = e.target.value; syncSaleTotalsOnly(); }));
  main.querySelectorAll('.sa-qty').forEach(inp=>inp.addEventListener('change', ()=> render()));
  main.querySelectorAll('.sa-price').forEach(inp=>inp.addEventListener('input', e=>{ saleItems[Number(e.target.dataset.i)].price = e.target.value; syncSaleTotalsOnly(); }));
  main.querySelectorAll('.sa-price').forEach(inp=>inp.addEventListener('change', ()=> render()));
  main.querySelectorAll('.sa-imei').forEach(sel=>sel.addEventListener('change', e=>{
    const i = Number(e.target.dataset.i), u = Number(e.target.dataset.u);
    if(!Array.isArray(saleItems[i].imeiUnitIds)) saleItems[i].imeiUnitIds = [];
    saleItems[i].imeiUnitIds[u] = e.target.value;
    render();
  }));
  const saveSaleBtn = main.querySelector('[data-action="save-sale"]');
  if(saveSaleBtn) saveSaleBtn.addEventListener('click', doSaveSale);
  const saCustomerInp = main.querySelector('#sa-customer');
  const saPhoneInp = main.querySelector('#sa-phone');
  const saAddressInp = main.querySelector('#sa-address');
  function fillFromCustomer(c){
    if(!c) return;
    if(saCustomerInp && c.name) saCustomerInp.value = c.name;
    if(saPhoneInp && c.phone) saPhoneInp.value = c.phone;
    if(saAddressInp && !saAddressInp.value && c.address) saAddressInp.value = c.address;
  }
  if(saCustomerInp) saCustomerInp.addEventListener('change', e=>{
    const match = customerLedgerList().find(c=> c.key!=='walk-in' && c.name.toLowerCase()===e.target.value.trim().toLowerCase());
    if(match) fillFromCustomer(match);
  });
  if(saPhoneInp) saPhoneInp.addEventListener('change', e=>{
    const match = customerLedgerList().find(c=> c.phone && c.phone===e.target.value.trim());
    if(match) fillFromCustomer(match);
  });
  main.querySelectorAll('[data-action="print-sale"]').forEach(b=>b.addEventListener('click', ()=> printInvoice(b.dataset.id)));
  main.querySelectorAll('[data-action="edit-sale"]').forEach(b=>b.addEventListener('click', ()=> openEditSale(b.dataset.id)));
  main.querySelectorAll('[data-action="del-sale"]').forEach(b=>b.addEventListener('click', ()=> doDeleteSale(b.dataset.id)));

  // Users (admin-only)
  const addUserBtn = main.querySelector('[data-action="add-user"]');
  if(addUserBtn) addUserBtn.addEventListener('click', ()=> openModal(userFormModal()));
  main.querySelectorAll('[data-action="del-user"]').forEach(b=>b.addEventListener('click', ()=> doRemoveUser(b.dataset.username)));

  // Ledger
  main.querySelectorAll('[data-action="ledger-tab"]').forEach(b=>b.addEventListener('click', ()=>{ ledgerTab = b.dataset.tab; ledgerSearch=''; render(); }));
  const ledgerSearchInp = main.querySelector('#ledger-search');
  if(ledgerSearchInp) ledgerSearchInp.addEventListener('input', e=>{ ledgerSearch = e.target.value; render(); });
  const addCustomerBtn = main.querySelector('[data-action="add-customer"]');
  if(addCustomerBtn) addCustomerBtn.addEventListener('click', ()=> openModal(customerFormModal(null)));
  main.querySelectorAll('[data-action="edit-customer"]').forEach(b=>b.addEventListener('click', ()=>{
    const existing = customerById(b.dataset.key);
    const row = customerLedgerList().find(c=>c.key===b.dataset.key);
    openModal(customerFormModal(existing || (row ? { id:null, name:row.name, phone:row.phone, address:'', email:'', notes:'' } : null)));
  }));
  main.querySelectorAll('[data-action="del-customer"]').forEach(b=>b.addEventListener('click', ()=> doDeleteCustomer(b.dataset.key)));
  main.querySelectorAll('[data-action="add-payment"]').forEach(b=>b.addEventListener('click', ()=>{
    openModal(paymentFormModal(b.dataset.key,b.dataset.name,b.dataset.type));
  }));
  main.querySelectorAll('[data-action="view-statement"]').forEach(b=>b.addEventListener('click', ()=>{
    openModal(statementModal(b.dataset.type, b.dataset.key, b.dataset.name, b.dataset.phone));
  }));

  // Reports
  const repMonth = main.querySelector('#report-month');
  if(repMonth) repMonth.addEventListener('change', e=>{ reportMonth = e.target.value; render(); });
}

function syncPurchaseTotalsOnly(){

  document.querySelectorAll('#purchase-item-rows .itemrow').forEach((row,i)=>{
    row.children[3].textContent = money((Number(purchaseItems[i].qty)||0)*(Number(purchaseItems[i].price)||0));
  });
  const totalEl = document.querySelector('#main .grid.cols-2 .num[style*="20px"]');
  if(totalEl) totalEl.textContent = money(total);
}
function syncSaleTotalsOnly(){
  document.querySelectorAll('#sale-item-rows .itemrow').forEach((row,i)=>{
    row.children[3].textContent = money((Number(saleItems[i].qty)||0)*(Number(saleItems[i].price)||0));
  });
  const subtotal = saleItems.reduce((a,it)=> a + (Number(it.qty)||0)*(Number(it.price)||0), 0);
  const paidInput = document.getElementById('sa-paid');
  const totalEl = document.querySelector('#main .grid.cols-4 .num[style*="20px"]');
  if(totalEl) totalEl.textContent = money(subtotal);
}

function doSavePurchase(){
  const supplier = document.getElementById('pu-supplier').value.trim();
  if(!supplier){ alert('Please enter a supplier name.'); return; }
  const date = document.getElementById('pu-date').value || todayISO();
  const invoiceNo = document.getElementById('pu-invno').value.trim() || nextPurchaseNo();
  const paid = Number(document.getElementById('pu-paid').value) || 0;

  // Validate IMEI/serial entry up front — mandatory for every item, exact count, no duplicates.
  const seenInThisPurchase = new Set();
  for(const it of purchaseItems){
    const qty = Number(it.qty)||0;
    if(qty<=0) continue;
    const label = it.name.trim() || (it.productId ? productById(it.productId).name : 'this item');
    const list = parseImeiLines(it.imeiText);
    if(list.length !== qty){
      alert(`Enter exactly ${qty} IMEI/serial number${qty===1?'':'s'} for "${label}" (currently ${list.length}).`);
      return;
    }
    for(const imei of list){
      const key = imei.toLowerCase();
      if(seenInThisPurchase.has(key)){ alert(`Duplicate IMEI "${imei}" entered more than once in this purchase.`); return; }
      seenInThisPurchase.add(key);
      if((state.imeiUnits||[]).some(u=>u.imei.toLowerCase()===key)){ alert(`IMEI "${imei}" already exists in IMEI Tracking. Each unit must be unique.`); return; }
    }
  }

  const items = [];
  const purchaseId = uid('pur');
  purchaseItems.forEach(it=>{
    const qty = Number(it.qty)||0;
    const price = Number(it.price)||0;
    if(qty<=0) return;
    let productId = it.productId;
    if(!productId){
      const name = it.name.trim();
      if(!name) return;
      const np = { id: uid('p'), name, brand:'', imei:'', purchasePrice: price, salePrice: Math.round(price*1.1), stock:0, minStock:2 };
      state.products.push(np);
      productId = np.id;
    }
    const prod = productById(productId);
    prod.stock = Number(prod.stock||0) + qty;
    prod.purchasePrice = price;
    items.push({ productId, name: prod.name, qty, price });
    addImeiUnitsFromPurchase(productId, prod.name, it.imeiText, purchaseId, date);
  });
  if(items.length===0){ alert('Add at least one item with quantity, and its required IMEI/serial numbers.'); return; }
  const total = items.reduce((a,it)=>a+it.qty*it.price,0);
  state.purchases.push({ id: purchaseId, date, invoiceNo, supplier, items, total, paid, due: total-paid });
  state.counters.purchase += 1;
  purchaseItems = [];
  saveState();
  switchTab('purchase');
}

function doSaveSale(){
  const customer = document.getElementById('sa-customer').value.trim();
  const customerPhone = document.getElementById('sa-phone').value.trim();
  const customerAddress = document.getElementById('sa-address').value.trim();
  const date = document.getElementById('sa-date').value || todayISO();
  const invoiceNo = document.getElementById('sa-invno').value.trim() || nextInvoiceNo();
  const discount = Number(document.getElementById('sa-discount').value) || 0;
  const paymentMode = document.getElementById('sa-mode').value;

  const items = [];
  let error = '';
  const seenIdsAcrossSale = new Set();
  saleItems.forEach(it=>{
    const qty = Number(it.qty)||0;
    const price = Number(it.price)||0;
    if(!it.productId || qty<=0) return;
    const prod = productById(it.productId);
    if(!prod){ return; }
    if(qty > Number(prod.stock)){ error = `Not enough stock for "${prod.name}" (available: ${prod.stock}).`; return; }
    const ids = (it.imeiUnitIds||[]).filter(Boolean);
    if(ids.length !== qty){ error = `Select an IMEI/serial for every unit of "${prod.name}" (${ids.length} of ${qty} selected).`; return; }
    for(const id of ids){
      if(seenIdsAcrossSale.has(id)){ error = `The same IMEI unit was selected twice for "${prod.name}".`; return; }
      seenIdsAcrossSale.add(id);
    }
    items.push({ productId: it.productId, name: prod.name, qty, price, imeiUnitIds: ids });
  });
  if(error){ alert(error); return; }
  if(items.length===0){ alert('Add at least one item to the bill, with an IMEI/serial selected for each unit.'); return; }

  const subtotal = items.reduce((a,it)=>a+it.qty*it.price,0);
  const total = Math.max(subtotal - discount, 0);
  let paid = Number(document.getElementById('sa-paid').value);
  if(isNaN(paid)) paid = total;

  items.forEach(it=>{
    const prod = productById(it.productId);
    prod.stock = Number(prod.stock) - it.qty;
  });

  const sale = { id: uid('sale'), date, invoiceNo, customer, customerPhone, customerAddress, items, subtotal, discount, total, paid, paymentMode };
  state.sales.push(sale);
  state.counters.invoice += 1;

  // Register/refresh this customer in the customer directory, and link any
  // chosen IMEI units to this sale so the IMEI Tracking report stays in sync.
  upsertCustomerFromSale(customer, customerPhone, customerAddress);
  items.forEach(it=>{ (it.imeiUnitIds||[]).forEach(id=> markImeiUnitSold(id, sale.id, date, customer, customerPhone)); });

  saleItems = [];
  saveState();
  activeTab = 'sales';
  render();
  printInvoice(sale.id);
}

function upsertCustomerFromSale(name, phone, address){
  if(!name && !phone) return;
  const key = customerKey({ name, phone });
  if(key==='walk-in') return;
  let c = customerById(key);
  if(!c){
    c = { id: uid('cust'), name: name||'Walk-in', phone: phone||'', address: address||'', email:'', notes:'', createdAt: todayISO() };
    state.customers.push(c);
  }else{
    if(name) c.name = name;
    if(phone) c.phone = phone;
    if(address) c.address = address;
  }
}

function syncProductImeiField(prod){
  const imei = (prod.imei||'').trim();
  if(!imei) return;
  const key = imei.toLowerCase();
  const existing = (state.imeiUnits||[]).find(u=>u.imei.toLowerCase()===key);
  if(existing){
    if(existing.status==='sold' && existing.productId!==prod.id){
      // Already sold under a different product record — don't silently reassign.
      return;
    }
    existing.productId = prod.id;
    existing.productName = prod.name;
    return;
  }
  state.imeiUnits.push({ id: uid('imei'), imei, productId: prod.id, productName: prod.name, status:'in_stock', purchaseId:null, purchaseDate: todayISO(), saleId:null, saleDate:null, customer:'', customerPhone:'' });
}

/* Modal helpers */
function openModal(html){
  document.getElementById('modal-root').innerHTML = html;
  attachModalHandlers();
}
function closeModal(){ document.getElementById('modal-root').innerHTML = ''; }

function attachModalHandlers(){
  const root = document.getElementById('modal-root');
  root.querySelectorAll('[data-close="modal"]').forEach(el=>el.addEventListener('click', closeModal));
  root.querySelectorAll('[data-stop]').forEach(el=>el.addEventListener('click', e=>e.stopPropagation()));

  const saveProdBtn = root.querySelector('[data-action="save-product"]');
  if(saveProdBtn) saveProdBtn.addEventListener('click', ()=>{
    const name = document.getElementById('p-name').value.trim();
    if(!name){ alert('Product name is required.'); return; }
    const id = saveProdBtn.dataset.id;
    const data = {
      name,
      brand: document.getElementById('p-brand').value.trim(),
      imei: document.getElementById('p-imei').value.trim(),
      hsn: document.getElementById('p-hsn').value.trim(),
      purchasePrice: Number(document.getElementById('p-purchase').value)||0,
      salePrice: Number(document.getElementById('p-sale').value)||0,
      stock: Number(document.getElementById('p-stock').value)||0,
      minStock: Number(document.getElementById('p-minstock').value)||2,
    };
    if(id){
      const p = productById(id);
      Object.assign(p, data);
      syncProductImeiField(p);
    }else{
      const np = { id: uid('p'), ...data };
      state.products.push(np);
      syncProductImeiField(np);
    }
    saveState(); closeModal(); render();
  });

  const saveImeiBtn = root.querySelector('[data-action="save-imei"]');
  if(saveImeiBtn) saveImeiBtn.addEventListener('click', ()=>{
    const imei = document.getElementById('im-imei').value.trim();
    const productId = document.getElementById('im-product').value;
    const date = document.getElementById('im-date').value || todayISO();
    const status = document.getElementById('im-status').value;
    if(!imei){ alert('Enter an IMEI / serial number.'); return; }
    if(!productId){ alert('Select a product.'); return; }
    const id = saveImeiBtn.dataset.id;
    const prod = productById(productId);
    if(id){
      const u = state.imeiUnits.find(x=>x.id===id);
      const dupe = state.imeiUnits.some(x=>x.id!==id && x.imei.toLowerCase()===imei.toLowerCase());
      if(dupe){ alert('Another unit already has this IMEI.'); return; }
      Object.assign(u, { imei, productId, productName: prod.name, purchaseDate: date, status });
      if(status==='in_stock'){ u.saleId=null; u.saleDate=null; u.customer=''; u.customerPhone=''; }
    }else{
      const dupe = state.imeiUnits.some(x=>x.imei.toLowerCase()===imei.toLowerCase());
      if(dupe){ alert('A unit with this IMEI already exists.'); return; }
      state.imeiUnits.push({ id: uid('imei'), imei, productId, productName: prod.name, status, purchaseId:null, purchaseDate: date, saleId:null, saleDate:null, customer:'', customerPhone:'' });
    }
    saveState(); closeModal(); render();
  });

  const savePayBtn = root.querySelector('[data-action="save-payment"]');
  if(savePayBtn) savePayBtn.addEventListener('click', ()=>{
    const amount = Number(document.getElementById('pay-amount').value);
    if(!amount || amount<=0){ alert('Enter a valid amount.'); return; }
    state.payments.push({
      id: uid('pay'),
      date: document.getElementById('pay-date').value || todayISO(),
      partyKey: savePayBtn.dataset.key,
      partyName: savePayBtn.dataset.name,
      partyType: savePayBtn.dataset.type,
      amount,
      mode: document.getElementById('pay-mode').value,
      note: document.getElementById('pay-note').value.trim(),
    });
    saveState(); closeModal(); render();
  });

  const addPayFromStatement = root.querySelector('[data-action="add-payment"]');
  if(addPayFromStatement) addPayFromStatement.addEventListener('click', ()=>{
    openModal(paymentFormModal(addPayFromStatement.dataset.key, addPayFromStatement.dataset.name, addPayFromStatement.dataset.type));
  });

  const doPrintBtn = root.querySelector('[data-action="do-print"]');
  if(doPrintBtn) doPrintBtn.addEventListener('click', ()=> window.print());

  const saveCustomerBtn = root.querySelector('[data-action="save-customer"]');
  if(saveCustomerBtn) saveCustomerBtn.addEventListener('click', ()=>{
    const name = document.getElementById('cu-name').value.trim();
    if(!name){ alert('Customer name is required.'); return; }
    const data = {
      name,
      phone: document.getElementById('cu-phone').value.trim(),
      address: document.getElementById('cu-address').value.trim(),
      email: document.getElementById('cu-email').value.trim(),
      notes: document.getElementById('cu-notes').value.trim(),
    };
    const id = saveCustomerBtn.dataset.id;
    if(id){
      const c = (state.customers||[]).find(x=>x.id===id);
      if(c) Object.assign(c, data);
    }else{
      const dupeKey = customerKey(data);
      if(dupeKey!=='walk-in' && (state.customers||[]).some(c=>customerKey(c)===dupeKey)){
        alert('A customer with this name/phone already exists — use Edit instead.');
        return;
      }
      state.customers.push({ id: uid('cust'), createdAt: todayISO(), ...data });
    }
    saveState(); closeModal(); render();
  });

  const printStatementBtn = root.querySelector('[data-action="print-statement"]');
  if(printStatementBtn) printStatementBtn.addEventListener('click', ()=>{
    printStatement(printStatementBtn.dataset.type, printStatementBtn.dataset.key, printStatementBtn.dataset.name, printStatementBtn.dataset.phone);
  });

  // Edit-sale modal (admin-only)
  const esAddRow = root.querySelector('[data-action="es-add-row"]');
  if(esAddRow) esAddRow.addEventListener('click', ()=>{
    editSaleItems.push({ productId:'', qty:1, price:0 });
    openModal(editSaleModalHtml(state.sales.find(x=>x.id===editSaleId)));
  });
  root.querySelectorAll('[data-action="es-rm-row"]').forEach(b=>b.addEventListener('click', ()=>{
    editSaleItems.splice(Number(b.dataset.i),1);
    if(editSaleItems.length===0) editSaleItems.push({ productId:'', qty:1, price:0 });
    openModal(editSaleModalHtml(state.sales.find(x=>x.id===editSaleId)));
  }));
  root.querySelectorAll('.es-product').forEach(sel=>sel.addEventListener('change', e=>{
    const i = Number(e.target.dataset.i);
    editSaleItems[i].productId = e.target.value;
    if(e.target.value){ const p = productById(e.target.value); editSaleItems[i].price = p.salePrice; }
    openModal(editSaleModalHtml(state.sales.find(x=>x.id===editSaleId)));
  }));
  root.querySelectorAll('.es-qty').forEach(inp=>inp.addEventListener('input', e=>{ editSaleItems[Number(e.target.dataset.i)].qty = e.target.value; syncEditSaleTotalsOnly(); }));
  root.querySelectorAll('.es-price').forEach(inp=>inp.addEventListener('input', e=>{ editSaleItems[Number(e.target.dataset.i)].price = e.target.value; syncEditSaleTotalsOnly(); }));
  const saveEditSaleBtn = root.querySelector('[data-action="save-edit-sale"]');
  if(saveEditSaleBtn) saveEditSaleBtn.addEventListener('click', doSaveEditedSale);
  const esCustomerInp = root.querySelector('#es-customer');
  const esPhoneInp = root.querySelector('#es-phone');
  const esAddressInp = root.querySelector('#es-address');
  function esFillFromCustomer(c){
    if(!c) return;
    if(esCustomerInp && c.name) esCustomerInp.value = c.name;
    if(esPhoneInp && c.phone) esPhoneInp.value = c.phone;
    if(esAddressInp && !esAddressInp.value && c.address) esAddressInp.value = c.address;
  }
  if(esCustomerInp) esCustomerInp.addEventListener('change', e=>{
    const match = customerLedgerList().find(c=> c.key!=='walk-in' && c.name.toLowerCase()===e.target.value.trim().toLowerCase());
    if(match) esFillFromCustomer(match);
  });
  if(esPhoneInp) esPhoneInp.addEventListener('change', e=>{
    const match = customerLedgerList().find(c=> c.phone && c.phone===e.target.value.trim());
    if(match) esFillFromCustomer(match);
  });

  // Add-user modal (admin-only) — stored directly in state.users, no external auth service needed.
  const saveUserBtn = root.querySelector('[data-action="save-user"]');
  if(saveUserBtn) saveUserBtn.addEventListener('click', ()=>{
    const errBox = document.getElementById('user-form-error');
    const showErr = m=>{ errBox.textContent = m; errBox.style.display = 'block'; };
    const username = document.getElementById('u-username').value.trim();
    const password = document.getElementById('u-password').value;
    const role = document.getElementById('u-role').value;
    if(!/^[a-zA-Z0-9._-]{3,}$/.test(username)){ showErr('Username must be 3+ characters: letters, numbers, dot, underscore or hyphen only.'); return; }
    if(!password || password.length<4){ showErr('Password must be at least 4 characters.'); return; }
    if(state.users.some(u=>u.username.toLowerCase()===username.toLowerCase())){ showErr('That username is already taken.'); return; }
    state.users.push({ username, password, role, createdAt: todayISO(), createdBy: currentUser? currentUser.username : '' });
    saveState(); closeModal(); render();
  });
}

/* =========================================================
   INIT
   ========================================================= */
(function initAuth(){
  const loginScreen = document.getElementById('login-screen');
  const appRoot = document.getElementById('app');
  const errBox = document.getElementById('login-error');
  const userInp = document.getElementById('login-email');
  const passInp = document.getElementById('login-password');
  const submitBtn = document.getElementById('login-submit');
  const signoutBtn = document.getElementById('signout-btn');

  function showError(msg){ errBox.textContent = msg; errBox.style.display = 'block'; }
  function hideError(){ errBox.style.display = 'none'; }

  function signInAs(rec){
    currentUser = { username: rec.username, role: rec.role };
    localStorage.setItem(SESSION_KEY, rec.username);
    loginScreen.style.display = 'none';
    appRoot.style.display = 'flex';
    if(typeof closeMobileSidebar==='function') closeMobileSidebar();
    render();
  }

  function doLogin(){
    hideError();
    const username = userInp.value.trim();
    const password = passInp.value;
    if(!username || !password){ showError('Enter your username and password.'); return; }
    const rec = findUserByCredentials(username, password);
    if(!rec){ showError('Incorrect username or password.'); return; }
    signInAs(rec);
  }
  submitBtn.addEventListener('click', doLogin);
  passInp.addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
  userInp.addEventListener('keydown', e=>{ if(e.key==='Enter') passInp.focus(); });

  if(signoutBtn) signoutBtn.onclick = ()=>{
    currentUser = null;
    localStorage.removeItem(SESSION_KEY);
    appRoot.style.display = 'none';
    loginScreen.style.display = 'flex';
    userInp.value = ''; passInp.value = ''; hideError();
    if(typeof closeMobileSidebar==='function') closeMobileSidebar();
  };

  (async function boot(){
    await loadState();
    seedAdminIfNeeded();
    const savedUsername = localStorage.getItem(SESSION_KEY);
    const rec = savedUsername ? state.users.find(u=>u.username===savedUsername) : null;
    if(rec){
      signInAs(rec);
    }else{
      localStorage.removeItem(SESSION_KEY);
      appRoot.style.display = 'none';
      loginScreen.style.display = 'flex';
    }
  })();
})();
</script>
